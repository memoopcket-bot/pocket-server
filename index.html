<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Option Live Dashboard (2026)</title>
    <style>
        :root {
            --bg-main: #0b0e14;
            --bg-card: #151a22;
            --border: #222b36;
            --text: #c5cdd8;
            --primary: #2463eb;
            --success: #10b981;
            --danger: #ef4444;
        }
        body {
            background-color: var(--bg-main);
            color: var(--text);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        input, select, button {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            background: #1e2530;
            border: 1px solid var(--border);
            color: #fff;
            border-radius: 8px;
            font-size: 14px;
            margin-top: 5px;
        }
        button {
            background: var(--primary);
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }
        button:active { transform: scale(0.98); }
        .btn-danger { background: var(--danger); }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }
        .badge {
            padding: 4px 8px;
            border-radius: 20px;
            font-weight: bold;
        }
        .badge-red { background: rgba(239,68,68,0.2); color: var(--danger); }
        .badge-green { background: rgba(16,185,129,0.2); color: var(--success); }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 13px;
        }
        th, td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }
        th { background: #1a222d; color: #94a3b8; }
        .log-box {
            background: #000;
            color: #38bdf8;
            font-family: monospace;
            padding: 10px;
            border-radius: 8px;
            height: 120px;
            overflow-y: auto;
            font-size: 11px;
            direction: ltr;
            text-align: left;
        }
    </style>
</head>
<body>
<div class="container">

    <!-- كارت التحكم بالاتصال -->
    <div class="card">
        <div class="status-bar">
            <div>حالة الاتصال: <span id="statusBadge" class="badge badge-red">منقطع</span></div>
            <div>الرصيد: <span id="balanceText" style="color:var(--success); font-weight:bold;">$0.00</span></div>
        </div>
        <input type="text" id="ssidInput" placeholder="ضع حزمة التوثيق الكاملة أو الـ SSID المكون من 32 حرفاً هنا...">
        <div class="grid-2" style="margin-top: 10px;">
            <button id="connectBtn" onclick="initSmartConnection()">اتصال بشري مباشر</button>
            <button class="btn-danger" onclick="disconnectAll()">قطع الاتصال</button>
        </div>
    </div>

    <!-- كارت سحب البيانات والشموع -->
    <div class="card">
        <div class="grid-2">
            <div>
                <label>الزوج المختار</label>
                <select id="pairSelect">
                    <option value="EURUSD">EURUSD (عالمي)</option>
                    <option value="EURUSD_otc">EURUSD_otc (منصة)</option>
                    <option value="USDJPY_otc">USDJPY_otc (منصة)</option>
                    <option value="GBPUSD_otc">GBPUSD_otc (منصة)</option>
                </select>
            </div>
            <div>
                <label>عدد الشموع</label>
                <input type="number" id="limitInput" value="50">
            </div>
        </div>
        <button style="margin-top:12px; background:var(--success);" onclick="requestLiveCandles()">جلب وفحص الشموع اللحظية</button>
    </div>

    <!-- جداول عرض الأسعار والنتائج -->
    <div class="card">
        <h4 style="margin:0 0 10px 0;">📊 جداول البث المباشر المفرزة</h4>
        <table>
            <thead>
                <tr>
                    <th>الأصل / الزوج</th>
                    <th>السعر الحالي</th>
                    <th>الحالة اللحظية</th>
                </tr>
            </thead>
            <tbody id="pairsTableBody">
                <tr>
                    <td colspan="3" style="color:#64748b;">في انتظار إطلاق الاتصال المباشر...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- سجل العمليات التفصيلي لقهر الحظر -->
    <div class="card">
        <div class="status-bar" style="margin-bottom:5px;">
            <span style="font-weight:bold;">📜 سجل محرك التمويه الذكي:</span>
            <span id="serverTime" style="color:#64748b;">--:--:--</span>
        </div>
        <div id="logBox" class="log-box">تطبيق جاهز. بانتظار التوثيق من هاتف المستخدم...</div>
    </div>

</div>
<script>
    let localWS = null; // الاتصال المباشر بمنصة بوكت أوبشن
    let renderWS = null; // الاتصال بسيرفر ريندر المخصص للباكيند
    let isConnected = false;
    let pingInterval = null;

    // تحديد رابط سيرفر ريندر تلقائياً بناءً على رابط الصفحة الحالي
    const RENDER_WS_URL = window.location.origin.replace(/^http/, 'ws');

    function log(msg, isError = false) {
        const box = document.getElementById("logBox");
        const time = new Date().toLocaleTimeString();
        const color = isError ? "#ef4444" : "#38bdf8";
        box.innerHTML += `<div style="color:${color}">[${time}] ${msg}</div>`;
        box.scrollTop = box.scrollHeight;
    }

    // تشغيل محرك الاتصال الذكي المزدوج
    function initSmartConnection() {
        let ssid = document.getElementById("ssidInput").value.trim();
        if (!ssid) {
            log("⚠️ خطأ: يرجى وضع رمز الـ SSID أو حزمة التوثيق أولاً!", true);
            return;
        }

        // إذا كانت الحزمة المنسوخة كاملة، نستخرج الـ SSID منها ذكياً
        if (ssid.includes("auth")) {
            try {
                if (ssid.startsWith("42")) ssid = ssid.substring(2);
                const parsed = JSON.parse(ssid);
                if (parsed[1] && parsed[1].session) {
                    ssid = parsed[1].session;
                }
            } catch (e) {
                log("⚠️ تحذير: فشل تفكيك الحزمة الكاملة، سيتم تجربة الاتصال بالنص المنسوخ كما هو.");
            }
        }

        log("🔗 جاري تشغيل الجسر البشري المباشر (Client-Side Bridge)...");
        connectToPocketOption(ssid);
    }

    // 1. الاتصال المباشر من هاتفك بالمنصة (يستحيل حظره بـ 403 لأن الـ IP بشري ومقبول)
    function connectToPocketOption(ssid) {
        if (localWS) { localWS.close(); }

        const targetServer = "wss://api-eu.po.market/socket.io/?EIO=4&transport=websocket";
        log(`🌐 جاري الاتصال بالسيرفر الرسمي عبر متصفحك: api-eu.po.market`);

        localWS = new WebSocket(targetServer);

        localWS.onopen = function() {
            log("⚡ تم فتح خط الاتصال المباشر مع المنصة بنجاح! جاري الترقية والتوثيق...");
            localWS.send("40"); // حزمة ترقية بروتوكول Socket.IO
        };

        localWS.onmessage = function(evt) {
            const msg = evt.data;

            // محرك الحفاظ على الاتصال حياً (Ping-Pong) تلقائياً
            if (msg === "2") {
                localWS.send("3");
                return;
            }

            if (msg.startsWith("0")) {
                // إرسال حزمة التوثيق فور استقبال رسالة الترحيب من السيرفر
                const authPacket = {
                    "session": ssid, "isDemo": 0, "uid": 0,
                    "platform": 2, "isFastHistory": true, "isOptimized": true
                };
                localWS.send(`42["auth",${JSON.stringify(authPacket)}]`);
                log("🔑 تم إرسال حزمة التوثيق الآمنة للمنصة.");
            }

            if (msg.startsWith("42")) {
                try {
                    const clean = msg.substring(2);
                    const parsed = JSON.parse(clean);
                    const eventName = parsed[0];
                    const data = parsed[1];

                    if (eventName === "successauth") {
                        isConnected = true;
                        document.getElementById("statusBadge").className = "badge badge-green";
                        document.getElementById("statusBadge").innerText = "متصل بنجاح";
                        log("🎉 [نجاح التوثيق] المنصة قبلت الجلسة والبث اللحظي يعمل الآن!");
                        
                        // ربط الاتصال بسيرفر Render لنقل البيانات إليه
                        connectToRenderServer();
                    }

                    // تحديث الرصيد لايف في الواجهة
                    if (data && (data.balance !== undefined || data.amount !== undefined)) {
                        const bal = data.balance || data.amount || 0;
                        document.getElementById("balanceText").innerText = `$${parseFloat(bal).toFixed(2)}`;
                    }

                    // تمرير البيانات المباشرة المستلمة من هاتفك إلى خادم ريندر لمعالجتها
                    if (renderWS && renderWS.readyState === WebSocket.OPEN) {
                        renderWS.send(JSON.stringify({ action: "pipe_data", event: eventName, payload: data }));
                    }

                } catch (e) {}
            }
        };

        localWS.onerror = function(err) {
            log("❌ خطأ في الاتصال المباشر بالمنصة. تأكد من أن الـ SSID صالح ولم تنتهي صلاحيته.", true);
        };

        localWS.onclose = function() {
            log("🔌 تم قطع الاتصال بالسيرفر الرئيسي للمنصة.");
            updateDisconnectionUI();
        };
    }

    // 2. ربط متصفحك بسيرفر Render لنقل الأسعار وحساب الشموع المفرزة [1]
    function connectToRenderServer() {
        if (renderWS) { renderWS.close(); }
        log("☁️ جاري ربط البيانات المستلمة بسيرفر الباكيند (Render)...");

        renderWS = new WebSocket(RENDER_WS_URL);

        renderWS.onopen = function() {
            log("✅ تم ربط الباكيند بنجاح، السيرفر جاهز الآن لفرز وتحليل الشموع.");
            // إرسال نبضة أولى لتأكيد الربط
            renderWS.send(JSON.stringify({ action: "status" }));
        };

        renderWS.onmessage = function(evt) {
            try {
                const resp = JSON.parse(evt.data);
                // هنا يتم استقبال نتائج التحليل والفرز وجلب الشموع من سيرفر ريندر لعرضها بالجدول
                if (resp.action === "candles" && resp.success) {
                    log(`📊 تم استلام وتحليل عدد ${resp.count} شمعة لزوج ${resp.pair} بنجاح.`);
                    updateTableWithCandles(resp.pair, resp.data);
                }
            } catch (e) {}
        };
    }

    // طلب جلب وفحص الشموع اللحظية بناءً على خيارات المستخدم
    function requestLiveCandles() {
        if (!isConnected || !localWS) {
            log("⚠️ خطأ: لا يمكنك طلب الشموع والسيرفر غير متصل!", true);
            return;
        }
        const pair = document.getElementById("pairSelect").value;
        const limit = document.getElementById("limitInput").value || 50;

        log(`🔄 جاري إرسال طلب جلب الشموع لزوج [${pair}]...`);
        
        // صياغة الطلب وإرساله عبر الخط المباشر
        let sym = pair;
        if (pair.endsWith("_otc")) {
            sym = `#${pair.replace("_otc", "")}_otc`;
        }
        
        const req = { "asset": sym, "period": 60, "time": Math.floor(Date.now() / 1000), "count": parseInt(limit) };
        localWS.send(`42["loadHistoryPeriod",${JSON.stringify(req)}]`);
    }

    function updateTableWithCandles(pair, data) {
        if (!data || data.length === 0) return;
        const lastCandle = data[data.length - 1];
        const tbody = document.getElementById("pairsTableBody");
        
        // مسح النص الافتراضي عند أول استقبال للبيانات
        if (tbody.innerHTML.includes("في انتظار")) tbody.innerHTML = "";

        let rowId = `row_${pair}`;
        let row = document.getElementById(rowId);
        
        if (!row) {
            row = document.createElement("tr");
            row.id = rowId;
            tbody.appendChild(row);
        }

        const statusText = lastCandle.c > lastCandle.o ? "📈 صعود" : "📉 هبوط";
        const statusColor = lastCandle.c > lastCandle.o ? var(--success) : var(--danger);

        row.innerHTML = `
            <td style="font-weight:bold;">${pair}</td>
            <td style="color:#fff; font-family:monospace;">${lastCandle.c}</td>
            <td style="color:${statusColor}; font-weight:bold;">${statusText}</td>
        `;
    }

    function disconnectAll() {
        if (localWS) localWS.close();
        if (renderWS) renderWS.close();
        log("🔌 تم قطع كافة الاتصالات بناءً على طلب المستخدم.");
        updateDisconnectionUI();
    }

    function updateDisconnectionUI() {
        isConnected = false;
        document.getElementById("statusBadge").className = "badge badge-red";
        document.getElementById("statusBadge").innerText = "منقطع";
        document.getElementById("balanceText").innerText = "$0.00";
    }

    // تحديث ساعة النظام في الواجهة كل ثانية
    setInterval(() => {
        document.getElementById("serverTime").innerText = new Date().toLocaleTimeString();
    }, 1000);
</script>
</body>
</html>
