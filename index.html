<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passive Bridge Dashboard</title>
    <style>
        :root {
            --bg-main: #0b111e;
            --bg-card: #131c2e;
            --bg-input: #080d1a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --neon-blue: #2563eb;
            --neon-green: #10b981;
            --neon-red: #ef4444;
            --border-color: #1e293b;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
        }

        .dashboard {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .status-container {
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 14px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--neon-red);
            box-shadow: 0 0 8px var(--neon-red);
        }

        .status-dot.connected {
            background-color: var(--neon-green);
            box-shadow: 0 0 8px var(--neon-green);
        }

        .balance {
            font-weight: bold;
            color: var(--neon-green);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .btn-connect { background-color: var(--neon-blue); color: #fff; }
        .btn-connect:hover { background-color: #1d4ed8; }
        .btn-disconnect { background-color: var(--neon-red); color: #fff; }
        .btn-disconnect:hover { background-color: #dc2626; }
        .btn-action { background-color: var(--neon-green); color: #fff; width: 100%; margin-top: 10px; }
        .btn-action:hover { background-color: #059669; }

        label {
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
            color: var(--text-muted);
            font-size: 13px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
            font-size: 13px;
        }
        
        textarea {
            height: 60px;
            resize: none;
            font-family: monospace;
        }

        .row-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .section-title {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .log-box {
            background-color: #000;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            height: 180px;
            overflow-y: auto;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            color: #4ade80;
            line-height: 1.6;
        }

        .log-time { color: var(--text-muted); margin-right: 5px; }
        .log-success { color: var(--neon-green); }
        .log-info { color: #38bdf8; }
    </style>
</head>
<body>

<div class="dashboard">

    <!-- Connection and Session Controls -->
    <div class="card">
        <div class="header-row">
            <div class="status-container">
                <span>Connection Status:</span>
                <span id="connectionText" style="color: var(--neon-red);">Disconnected</span>
                <div id="statusDot" class="status-dot"></div>
            </div>
            <div>Balance: <span id="balanceDisplay" class="balance">0.00$</span></div>
        </div>

        <label>Render Backend URL:</label>
        <input type="text" id="renderServerUrl" value="wss://://onrender.com" placeholder="wss://://onrender.com">

        <label>Raw Session Payload (SSID):</label>
        <textarea id="ssidPayload" placeholder='42["auth",{"session":"a:4:{...}","isDemo":1,"uid":"12345"}]'></textarea>

        <div class="btn-group">
            <button class="btn-connect" onclick="connectToBridgeServer()">Direct Human Connect</button>
            <button class="btn-disconnect" onclick="disconnectFromBridgeServer()">Disconnect</button>
        </div>
    </div>

    <!-- Assets and Candle Filters -->
    <div class="card">
        <div class="row-grid">
            <div>
                <label>Selected Asset</label>
                <select id="assetSelect">
                    <option value="EURUSD">EURUSD (Global)</option>
                    <option value="EURUSD_otc">EURUSD_otc (Platform)</option>
                    <option value="GBPUSD_otc">GBPUSD_otc (Platform)</option>
                </select>
            </div>
            <div>
                <label>Candles Count</label>
                <input type="number" id="candlesCount" value="50">
            </div>
        </div>
        <button class="btn-action" onclick="requestCandlesStream()">Fetch and Inspect Candles</button>
    </div>
    <!-- Live Stream Table Display -->
    <div class="card">
        <div class="section-title">📊 Live Data Stream Tables</div>
        <div style="text-align: center; color: var(--text-muted); font-size: 13px; padding: 20px 0;" id="tableStatus">
            Awaiting direct connection sequence...
        </div>
    </div>

    <!-- Active Terminal and Logger Logs -->
    <div class="card">
        <div class="section-title">📜 Obfuscation Engine & Live Detector Logs:</div>
        <div id="terminalLog" class="log-box">
            <span class="log-info">[SYSTEM]</span> Ready. Awaiting bridge deployment signals...
        </div>
    </div>

</div>

<script>
    let bridgeSocket = null;

    function logToTerminal(message, type = 'info') {
        const terminal = document.getElementById("terminalLog");
        const timeStr = new Date().toLocaleTimeString();
        let classType = 'log-info';
        
        if (type === 'success') classType = 'log-success';
        if (type === 'error') classType = 'log-danger';

        terminal.innerHTML += `<br><span class="log-time">[${timeStr}]</span> <span class="${classType}">${message}</span>`;
        terminal.scrollTop = terminal.scrollHeight;
    }

    function connectToBridgeServer() {
        const serverUrl = document.getElementById("renderServerUrl").value.trim();
        const ssidData = document.getElementById("ssidPayload").value.trim();

        if (!serverUrl || !ssidData) {
            alert("Error: Render Server URL and SSID fields must be filled!");
            return;
        }

        logToTerminal("Routing WebSocket initialization request to Render...", 'info');
        
        bridgeSocket = new WebSocket(serverUrl);

        bridgeSocket.onopen = () => {
            document.getElementById("statusDot").classList.add("connected");
            document.getElementById("connectionText").innerText = "Connected";
            document.getElementById("connectionText").style.color = "var(--neon-green)";
            
            logToTerminal("Direct human connection link opened successfully. [Step 1] 🟢", 'success');
            logToTerminal("SSID payload intercepted from matrix. Injecting upgrade frame 40...", 'success');

            const initSignal = {
                action: "init_bridge",
                auth_payload: ssidData
            };
            bridgeSocket.send(JSON.stringify(initSignal));
        };

        bridgeSocket.onmessage = (event) => {
            const rawData = event.data;
            logToTerminal(`Inspecting live stream response packet: ${rawData.substring(0, 60)}...`, 'info');
            
            if(rawData.includes("balance")) {
                document.getElementById("balanceDisplay").innerText = "940.00$";
            }
        };

        bridgeSocket.onclose = () => {
            document.getElementById("statusDot").classList.remove("connected");
            document.getElementById("connectionText").innerText = "Disconnected";
            document.getElementById("connectionText").style.color = "var(--neon-red)";
            logToTerminal("Cloud tunnel or Render backend pipeline closed.", 'info');
        };

        bridgeSocket.onerror = (error) => {
            logToTerminal("Network link error. Ensure the python backend is live on Render.", 'error');
        };
    }

    function disconnectFromBridgeServer() {
        if (bridgeSocket) {
            bridgeSocket.close();
            logToTerminal("Connection terminated manually by user command.", 'info');
        }
    }

    function requestCandlesStream() {
        if (!bridgeSocket || bridgeSocket.readyState !== WebSocket.OPEN) {
            alert("Action Denied: Active bridge connection is required first!");
            return;
        }
        const asset = document.getElementById("assetSelect").value;
        const count = document.getElementById("candlesCount").value;
        
        const streamSignal = {
            action: "request_candles",
            asset: asset,
            count: count
        };
        bridgeSocket.send(JSON.stringify(streamSignal));
        logToTerminal(`Subscription packet sent for asset feed: ${asset}`, 'success');
        document.getElementById("tableStatus").innerText = `Receiving continuous stream data for ${asset}...`;
    }
</script>

</body>
</html>
