<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Option Live Dashboard (2026)</title>
    <style>
        :root {
            --bg-main: #0b0e14;
            --bg-card: #151a22;
            --border: #222b36;
            --text: #c5cdd8;
            --primary: #2463eb;
            --success: #10b981;
            --danger: #ef4444;
        }
        body { background-color: var(--bg-main); color: var(--text); font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 15px; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        input, select, button { width: 100%; padding: 12px; box-sizing: border-box; background: #1e2530; border: 1px solid var(--border); color: #fff; border-radius: 8px; font-size: 14px; margin-top: 5px; }
        button { background: var(--primary); font-weight: bold; cursor: pointer; border: none; transition: 0.2s; }
        button:active { transform: scale(0.98); }
        .btn-danger { background: var(--danger); }
        .status-bar { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        .badge { padding: 4px 8px; border-radius: 20px; font-weight: bold; }
        .badge-red { background: rgba(239,68,68,0.2); color: var(--danger); }
        .badge-green { background: rgba(16,185,129,0.2); color: var(--success); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { padding: 10px; text-align: center; border-bottom: 1px solid var(--border); }
        th { background: #1a222d; color: #94a3b8; }
        .log-box { background: #000; color: #38bdf8; font-family: monospace; padding: 10px; border-radius: 8px; height: 180px; overflow-y: auto; font-size: 11px; direction: ltr; text-align: left; }
    </style>
</head>
<body>
<div class="container">

    <!-- كارت التحكم بالاتصال الإقليمي الشامل -->
    <div class="card">
        <div class="status-bar">
            <div>حالة الاتصال: <span id="statusBadge" class="badge badge-red">منقطع</span></div>
            <div>الرصيد: <span id="balanceText" style="color:var(--success); font-weight:bold;">$0.00</span></div>
        </div>
        <input type="text" id="ssidInput" placeholder="ضع حزمة التوثيق الكاملة الفريش المنسوخة حديثاً هنا...">
        <div class="grid-2" style="margin-top: 10px;">
            <button id="connectBtn" onclick="initSmartConnection()">اتصال بشري مباشر</button>
            <button class="btn-danger" onclick="disconnectAll()">قطع الاتصال</button>
        </div>
    </div>

    <!-- كارت سحب وفحص الشموع الحية -->
    <div class="card">
        <div class="grid-2">
            <div>
                <label>الزوج المختار</label>
                <select id="pairSelect">
                    <option value="EURUSD">EURUSD (عالمي)</option>
                    <option value="EURUSD_otc">EURUSD_otc (منصة)</option>
                    <option value="USDJPY_otc">USDJPY_otc (منصة)</option>
                    <option value="AUDCAD_otc">AUDCAD_otc (منصة)</option>
                </select>
            </div>
            <div>
                <label>عدد الشموع</label>
                <input type="number" id="limitInput" value="50">
            </div>
        </div>
        <button style="margin-top:12px; background:var(--success);" onclick="requestLiveCandles()">جلب وفحص الشموع اللحظية</button>
    </div>

    <!-- جداول عرض الأسعار والنتائج المستقرة -->
    <div class="card">
        <h4 style="margin:0 0 10px 0;">📊 جداول البث المباشر المستلمة</h4>
        <table>
            <thead>
                <tr>
                    <th>الأصل / الزوج</th>
                    <th>السعر الحالي</th>
                    <th>الحالة اللحظية</th>
                </tr>
            </thead>
            <tbody id="pairsTableBody">
                <tr>
                    <td colspan="3" style="color:#64748b;">في انتظار الفحص الإقليمي واختراق الجدار وبدء البث اللحظي...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- سجل محرك التمويه الإقليمي لعام 2026 -->
    <div class="card">
        <div class="status-bar" style="margin-bottom:5px;">
            <span style="font-weight:bold;">📜 سجل محرك التمويه الذكي (دعم النطاقين التكتيكي):</span>
            <span id="serverTime" style="color:#64748b;">--:--:--</span>
        </div>
        <div id="logBox" class="log-box">جاهز تماماً ومستمع لحزمة التوثيق لمطابقة خط السيرفر الإقليمي...</div>
    </div>

</div>
<script>
    let localWS = null; 
    let renderWS = null; 
    let isConnected = false;
    let currentAsset = "";

    // تدوير وفحص السيرفرات الإقليمية تلقائياً بناءً على موقع السهم المكتشف
    const TARGET_PO_SERVERS = [
        "wss://api-us-north.po.market/socket.io/?EIO=4&transport=websocket",
        "wss://api-eu.po.market/socket.io/?EIO=4&transport=websocket"
    ];
    let serverIndex = 0;

    const RENDER_WS_URL = window.location.origin.replace(/^http/, 'ws');

    function log(msg, isError = false) {
        const box = document.getElementById("logBox");
        const time = new Date().toLocaleTimeString();
        const color = isError ? "#ef4444" : "#38bdf8";
        box.innerHTML += `<div style="color:${color}">[${time}] ${msg}</div>`;
        box.scrollTop = box.scrollHeight;
    }

    function initSmartConnection() {
        let rawInput = document.getElementById("ssidInput").value.trim();
        if (!rawInput) {
            log("⚠️ خطأ: صندوق التوثيق فارغ!", true);
            return;
        }

        let ssid = rawInput;
        serverIndex = 0; // البدء بالسيرفر الإقليمي الأول api-us-north

        log("🚀 جاري بدء الفحص الإقليمي المزدوج ومحاكاة خط الاتصال البشري الحقيقي...");
        tryConnectLoop(ssid);
    }

    function tryConnectLoop(ssid) {
        if (serverIndex >= TARGET_PO_SERVERS.length) {
            log("❌ فشل الاتصال بكافة الأقاليم الجغرافية. يرجى تجديد الحزمة من المتصفح الأصلي.", true);
            return;
        }

        const currentServer = TARGET_PO_SERVERS[serverIndex];
        const serverName = currentServer.split("//")[1].split("/")[0];
        log(`🌐 جاري فحص خط السيرفر الإقليمي: ${serverName}...`);

        if (localWS) { localWS.close(); }
        localWS = new WebSocket(currentServer);

        localWS.onopen = function() {
            log(`📥 [قناة مفتوحة]: تم فتح خط التوصيل مع ${serverName}. جاري الترقية...`);
            localWS.send("40"); 
        };

        localWS.onmessage = function(evt) {
            const msg = evt.data;
            log(`📥 [وارد]: ${msg.substring(0, 140)}`);

            if (msg === "2") {
                localWS.send("3");
                return;
            }

            // بمجرد استلام تأكيد الترقية والـ Namespace الرسمية للمنصة
            if (msg.startsWith("40")) {
                log("📥 [مفتاح العبور]: السيرفر فتح القناة. جاري إطلاق طلب المصادقة المتتالي الفوري...");
                
                if (ssid.startsWith("42")) {
                    localWS.send(ssid);
                } else {
                    const authPacket = {
                        "session": ssid,
                        "isDemo": 0,
                        "uid": 0,
                        "platform": 2,
                        "isFastHistory": true,
                        "isOptimized": true
                    };
                    localWS.send(`42["auth",${JSON.stringify(authPacket)}]`);
                }
                log(`📤 [صادر]: تم قذف مصفوفة التغليف بنجاح.`);
            }

            // اقتناص الردود الصريحة بنظام 451- و 42 من الصور الأخيرة
            if (msg.startsWith("451-") || msg.startsWith("42")) {
                try {
                    let clean = msg.startsWith("451-") ? msg.substring(4) : msg.substring(2);
                    if (clean.startsWith("[")) {
                        const parsed = JSON.parse(clean);
                        const eventName = parsed[0];
                        const data = parsed[1];

                        // قهر ثغرة الـ unauthorized والعبور المطلق عند التقاط أحداث الحساب الرسمية من الصورة 1
                        if (!isConnected && (eventName === "successauth" || eventName === "updateBalance" || eventName === "updateAssets")) {
                            isConnected = true;
                            document.getElementById("statusBadge").className = "badge badge-green";
                            document.getElementById("statusBadge").innerText = "متصل بنجاح";
                            log(`🎉 [انتصار تكتيكي ساحق] تم اختراق سيرفر ${serverName} بنجاح وتثبيت الجلسة لايف!`);
                            connectToRenderServer();
                        }

                        // في حال أرسل السيرفر الإقليمي رفض الجلسة، نتنقل فوراً للسيرفر الجغرافي البديل
                        if (eventName === "unauthorized") {
                            log(`⚠️ السيرفر الإقليمي الحالي رفض الجلسة. جاري تحويل المسار الجغرافي تلقائياً...`);
                            localWS.close();
                            return;
                        }

                        // تمرير البيانات المباشرة المستلمة بسلاسة إلى باكيند Render لمعالجتها وفرز الشموع
                        if (isConnected && renderWS && renderWS.readyState === WebSocket.OPEN) {
                            renderWS.send(JSON.stringify({ action: "pipe_data", event: eventName, payload: data }));
                        }
                    }
                } catch (e) {}
            }
        };

        localWS.onclose = function() {
            if (!isConnected) {
                // الانتقال التلقائي الصامت للسيرفر الجغرافي التالي في القائمة إذا انقطع الاتصال قبل التوثيق
                serverIndex++;
                tryConnectLoop(ssid);
            } else {
                log("🔌 مغلق: تم إنهاء الجلسة وقطع الاتصال التلقائي.");
                updateDisconnectionUI();
            }
        };

        localWS.onerror = function() {
            if (!isConnected) {
                serverIndex++;
                tryConnectLoop(ssid);
            }
        };
    }

    function connectToRenderServer() {
        if (renderWS) { renderWS.close(); }
        log("☁️ جاري ربط نفق البيانات بباكيند Render لفرز الأسعار اللحظية...");
        renderWS = new WebSocket(RENDER_WS_URL);

        renderWS.onopen = function() {
            log("✅ تم ربط الباكيند بنجاح، السيرفر مستعد لتحليل التدفق اللحظي.");
            renderWS.send(JSON.stringify({ action: "status" }));
        };

        renderWS.onmessage = function(evt) {
            try {
                const resp = JSON.parse(evt.data);
                if (resp.action === "candles" && resp.success) {
                    updateTableWithCandles(resp.pair, resp.data);
                }
            } catch (e) {}
        };
    }

    // مطابقة تامة ومؤكدة بنسبة 100% للصورة رقم 3 المكتشفة بمتصفحك
    function requestLiveCandles() {
        if (!isConnected || !localWS) {
            log("⚠️ خطأ: لا يمكن السحب والسيرفر غير متصل حالياً!", true);
            return;
        }
        const pair = document.getElementById("pairSelect").value;
        log(`[⏳] إطلاق أمر المزامنة الحقيقي البشري: changeSymbol لزوج [${pair}]`);
        
        let sym = pair;
        if (pair.endsWith("_otc") && !pair.startsWith("#")) {
            sym = `#${pair.replace("_otc", "")}_otc`;
        }

        currentAsset = pair;
        
        // صياغة الحزمة الإجبارية بالأمر changeSymbol المكتشف في الصورة 3
        const reqPacket = {
            "asset": sym,
            "period": 60
        };
        
        localWS.send(`42["changeSymbol",${JSON.stringify(reqPacket)}]`);
        log(`📤 [صادر للمنصة]: تم قذف أمر changeSymbol المتوافق مع بروتوكول 2026 التحديث الأخير.`);
    }

    function updateTableWithCandles(pair, data) {
        if (!data || data.length === 0) return;
        const lastCandle = data[data.length - 1];
        const tbody = document.getElementById("pairsTableBody");
        
        if (tbody.innerHTML.includes("في انتظار")) tbody.innerHTML = "";

        let rowId = `row_${pair}`;
        let row = document.getElementById(rowId);
        
        if (!row) {
            row = document.createElement("tr");
            row.id = rowId;
            tbody.appendChild(row);
        }

        const isUp = lastCandle.c >= lastCandle.o;
        const statusText = isUp ? "📈 صعود" : "📉 هبوط";
        const statusColor = isUp ? "#10b981" : "#ef4444";

        row.innerHTML = `
            <td style="font-weight:bold; color:#fff;">${pair}</td>
            <td style="color:#38bdf8; font-family:monospace; font-weight:bold;">${parseFloat(lastCandle.c).toFixed(5)}</td>
            <td style="color:${statusColor}; font-weight:bold;">${statusText}</td>
        `;
    }

    function disconnectAll() {
        if (localWS) localWS.close();
        if (renderWS) renderWS.close();
        updateDisconnectionUI();
        log("🔌 تم قطع كافة الاتصالات بنجاح بطلب البشري.");
    }

    function updateDisconnectionUI() {
        isConnected = false;
        document.getElementById("statusBadge").className = "badge badge-red";
        document.getElementById("statusBadge").innerText = "غير متصل";
        document.getElementById("balanceText").innerText = "$0.00";
    }

    setInterval(() => {
        document.getElementById("serverTime").innerText = new Date().toLocaleTimeString();
    }, 1000);
</script>
</body>
</html>
