<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة محاكاة بروتوكول Socket.IO للمنصة</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; padding: 25px; }
        .box { background: #1e293b; padding: 25px; border-radius: 12px; max-width: 900px; margin: 0 auto; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #38bdf8; }
        .input-group { display: flex; gap: 10px; margin: 20px 0; align-items: center; }
        input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 14px; }
        .btn { background: #0284c7; color: white; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn:hover { background: #0369a1; }
        
        /* نظام الأضواء التفاعلية المطلوب */
        .status-panel { display: flex; justify-content: space-around; background: #0f172a; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .indicator { display: flex; align-items: center; gap: 10px; font-size: 14px; }
        .bulb { width: 16px; height: 16px; border-radius: 50%; background: #475569; box-shadow: 0 0 5px #475569; transition: all 0.3s ease; }
        .bulb.orange { background: #f97316; box-shadow: 0 0 15px #f97316; }
        .bulb.green { background: #22c55e; box-shadow: 0 0 15px #22c55e; }
        .txt { font-weight: bold; }
        .txt.off { color: #ef4444; }
        .txt.on { color: #22c55e; }

        .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .panel { background: #0f172a; padding: 15px; border-radius: 8px; height: 350px; overflow-y: auto; display: flex; flex-direction: column; }
        table { width: 100%; border-collapse: collapse; text-align: center; }
        th, td { padding: 8px; border-bottom: 1px solid #1e293b; font-size: 14px; }
        th { background: #334155; color: #38bdf8; }
        
        /* شاشة عرض السجلات وحفظها */
        #logConsole { background: #000; color: #38bdf8; font-family: monospace; padding: 10px; font-size: 12px; flex: 1; border-radius: 4px; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="box">
    <h2>محاكي بروتوكول Socket.IO والمصادقة الجلسية (SSID) 🔍</h2>
    
    <div class="input-group">
        <input type="text" id="ssidInput" placeholder="أدخلي رمز الجلسة SSID المستخرج من متصفح المنصة...">
        <button class="btn" onclick="initiateSocketConnection()">بدء فحص الاتصال الحقيقي</button>
    </div>

    <!-- لوحة الأضواء والمؤشرات التفاعلية المطلوبة بدقة -->
    <div class="status-panel">
        <div class="indicator">
            <div id="srvLight" class="bulb"></div>
            <span>اتصال الـ WebSocket المباشر: <span id="srvTxt" class="txt off">غير متصل</span></span>
        </div>
        <div class="indicator">
            <div id="pltLight" class="bulb"></div>
            <span>حالة الجلسة والمصادقة (SSID): <span id="pltTxt" class="txt off">غير متصل</span></span>
        </div>
        <button class="btn" style="background: #10b981;" onclick="downloadSessionLogs()">📥 تحميل ملف السجل (TXT)</button>
    </div>

    <div class="layout">
        <!-- جدول بث الأسعار اللحظية -->
        <div class="panel">
            <h3 style="margin-top:0; color:#38bdf8;">أسعار أزواج Forex / OTC اللحظية</h3>
            <table>
                <thead>
                    <tr>
                        <th>الأصل</th>
                        <th>السعر المباشر</th>
                    </tr>
                </thead>
                <tbody id="assetsTableBody">
                    <!-- تحديث الأسعار التلقائي هنا -->
                </tbody>
            </table>
        </div>

        <!-- شاشة تتبع مسار حزم البروتوكول لقراءتها وفهمها -->
        <div class="panel">
            <h3 style="margin-top:0; color:#38bdf8;">سجل حركة حزم الاتصال (Traffic Log)</h3>
            <div id="logConsole">بانتظار بدء الاتصال لتسجيل الحزم المتبادلة...</div>
        </div>
    </div>
</div>

<script>
    let ws;
    let logData = "";
    // قائمة بكافة أزواج الـ OTC والفوركس المتاحة عبر المنصة للمراقبة
    const targetAssets = ["EURUSD_otc", "GBPUSD_otc", "USDJPY_otc", "EURGBP_otc", "EURUSD", "GBPUSD"];

    function appendLog(direction, message) {
        const timestamp = new Date().toISOString();
        const formattedLine = `[${timestamp}] [${direction}] ${message}\n`;
        logData += formattedLine;
        
        const consoleElem = document.getElementById("logConsole");
        if(consoleElem) {
            consoleElem.innerText += `[${direction}] ${message}\n`;
            consoleElem.scrollTop = consoleElem.scrollHeight;
        }
    }

    function initiateSocketConnection() {
        const ssid = document.getElementById("ssidInput").value.trim();
        if(!ssid) { alert("يرجى إدخال كود الـ SSID أولاً."); return; }

        // رابط خادم المنصة الرسمي المعتمد في مكتبات السوكيت المفتوحة
        const endpoint = "wss://://pocketoption.com";
        
        appendLog("اتصال", `جاري فتح قناة الـ WebSocket مع: ${endpoint}`);
        ws = new WebSocket(endpoint);

        // 1. بمجرد فتح الاتصال الفيزيائي بالخادم -> تفعيل الضوء البرتقالي
        ws.onopen = function() {
            document.getElementById("srvLight").className = "bulb orange";
            document.getElementById("srvTxt").innerText = "متصل (جاري التأسيس)";
            document.getElementById("srvTxt").className = "txt on";
            
            // إرسال الحزمة التأسيسية لبروتوكول Socket.IO رقم 40 لطلب فتح الجلسة البرمجية
            ws.send("40");
            appendLog("إرسال ->", "40 (طلب تهيئة بروتوكول Socket.IO)");

            // صياغة حزمة المصادقة الجلسية المعتمدة على الكود المنسوخ من المتصفح
            const authPacket = `42["auth",{"session":"${ssid}","isDemo":1,"uid":8888888,"platform":1}]`;
            ws.send(authPacket);
            appendLog("إرسال ->", `42["auth", {"session": "${ssid.substring(0, 10)}...", ...}]`);
        };

        // 2. استقبال وقراءة حزم البيانات من سيرفر المنصة
        ws.onmessage = function(event) {
            const rawMessage = event.data;
            appendLog("استقبال <-", rawMessage);

            // التحقق من قبول المصادقة لتفعيل الضوء الأخضر
            if (rawMessage.includes("auth_success") || rawMessage.includes("success_auth") || rawMessage.startsWith("42")) {
                // إذا تم قبول الجلسة، يتحول الضوء إلى الأخضر الكامل
                if(!document.getElementById("pltLight").classList.contains("green")) {
                    document.getElementById("pltLight").className = "bulb green";
                    document.getElementById("pltTxt").innerText = "متصل وموثق";
                    document.getElementById("pltTxt").className = "txt on";
                    
                    // بمجرد نجاح المصادقة، نقوم بإرسال حزم الاشتراك للأزواج
                    subscribeToAssets();
                }
            }

            // فك تشفير حزم الأسعار اللحظية (Tick Packets) المبتدئة بالرمز 42
            if (rawMessage.startsWith("42")) {
                try {
                    const parsed = JSON.parse(rawMessage.substring(2));
                    // إذا كانت الحزمة تحتوي على مصفوفة أحداث الأسعار
                    if (Array.isArray(parsed) && parsed[0] === "tick") {
                        const tickData = parsed[1];
                        renderLivePrice(tickData.asset, tickData.price);
                    }
                } catch(e) {}
            }

            // معالجة نبضات القلب لمنع فصل الخادم للاتصال تلقائياً (Ping/Pong)
            if (rawMessage === "2") {
                ws.send("3");
                appendLog("إرسال ->", "3 (استجابة نبضات القلب Pong)");
            }
        };

        ws.onclose = function() {
            appendLog("انقطاع", "تم إغلاق الاتصال بخادم المنصة.");
            resetAllIndicators();
        };

        ws.onerror = function(err) {
            appendLog("خطأ", "حدث خطأ في الاتصال بالشبكة.");
            resetAllIndicators();
        };
    }

    function subscribeToAssets() {
        // إرسال أوامر الاشتراك لكل زوج لضمان بدء تدفق الأسعار لحظياً
        targetAssets.forEach(asset => {
            const subPacket = `42["changeSymbol",{"asset":"${asset}","timeframe":60}]`;
            ws.send(subPacket);
            appendLog("إرسال ->", `طلب بث الأسعار لـ: ${asset}`);
        });
    }

    function renderLivePrice(asset, price) {
        let row = document.getElementById(`asset-${asset}`);
        const tbody = document.getElementById("assetsTableBody");
        if (!row) {
            row = document.createElement("tr");
            row.id = `asset-${asset}`;
            row.innerHTML = `<td><b>${asset.replace("_otc", " (OTC)")}</b></td><td style="color:#22c55e; font-weight:bold;">${price}</td>`;
            tbody.appendChild(row);
        } else {
            row.cells[1].innerText = price;
        }
    }

    function resetAllIndicators() {
        document.getElementById("srvLight").className = "bulb";
        document.getElementById("srvTxt").innerText = "غير متصل";
        document.getElementById("srvTxt").className = "txt off";
        document.getElementById("pltLight").className = "bulb";
        document.getElementById("pltTxt").innerText = "غير متصل";
        document.getElementById("pltTxt").className = "txt off";
    }

    function downloadSessionLogs() {
        // دالة تقوم بجمع كافة البيانات المسجلة وتنزيلها كملف نصي مستقل فوراً
        const blob = new Blob([logData], { type: "text/plain;charset=utf-8" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `pocket_api_handshake_log_${new Date().getTime()}.txt`;
        link.click();
    }
</script>
</body>
</html>
