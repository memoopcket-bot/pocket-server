<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passive Bridge - Pocket Option 2026</title>
    <style>
        :root {
            --bg-main: #121620;
            --bg-card: #1a202e;
            --primary: #00b074;
            --danger: #ff4a4a;
            --text: #ffffff;
            --text-muted: #8a96a3;
            --border: #263147;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .header-card {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid var(--border);
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .status-badge {
            color: var(--danger);
            font-weight: bold;
        }

        .status-badge.connected {
            color: var(--primary);
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: opacity 0.2s;
        }

        .btn-primary { background-color: #1e70ff; color: white; }
        .btn-danger { background-color: var(--danger); color: white; }
        .btn-success { background-color: var(--primary); color: white; width: 100%; margin-top: 10px; }
        .btn:hover { opacity: 0.9; }

        .control-card {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .select-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .select-field {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 14px;
            color: var(--text-muted);
        }

        select, input {
            background-color: var(--bg-main);
            border: 1px solid var(--border);
            color: white;
            padding: 10px;
            border-radius: 6px;
            outline: none;
            width: 100%;
        }

        .table-card {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid var(--border);
        }

        .table-title {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .grid-header, .grid-row {
            display: grid;
            grid-template-columns: 2fr 2fr 1fr;
            padding: 10px 5px;
            font-size: 13px;
        }

        .grid-header {
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
        }

        .grid-row {
            border-bottom: 1px solid dashed var(--border);
        }

        .log-card {
            background-color: #0b0e14;
            border-radius: 12px;
            padding: 15px;
            border: 1px solid var(--border);
        }

        .log-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #d1d5db;
        }

        .log-stream {
            height: 180px;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .log-in { color: #38bdf8; }
        .log-out { color: #facc15; }
        .log-sys { color: #a78bfa; }
        .log-err { color: var(--danger); }
    </style>
</head>
<body>

<div class="container">
    <!-- كرت الحالة والاتصال الحركي -->
    <div class="header-card">
        <div class="status-row">
            <div>الرصيد: <span style="color:var(--primary); font-weight:bold;">$0.00</span></div>
            <div>حالة الاتصال: <span id="connection-status" class="status-badge">غير متصل</span></div>
        </div>
        <div class="btn-group">
            <button class="btn btn-primary" onclick="startTunnel()">اتصال بشري مباشر</button>
            <button class="btn btn-danger" onclick="stopTunnel()">قطع الاتصال</button>
        </div>
    </div>

    <!-- كرت خيارات التحكم واختيار العملات -->
    <div class="control-card">
        <div class="select-row">
            <div class="select-field">
                <label>الزوج المختار</label>
                <select id="asset-select">
                    <option value="EURUSD">EURUSD (عالمي)</option>
                    <option value="AUDCAD_otc">AUDCAD_otc</option>
                    <option value="EURUSD_otc">EURUSD_otc</option>
                </select>
            </div>
            <div class="select-field">
                <label>عدد الشموع</label>
                <input type="number" id="candles-count" value="50" min="1" max="150">
            </div>
        </div>
        <button class="btn btn-success" onclick="triggerSubscription()">جلب وفحص الشموع اللحظية</button>
    </div>

    <!-- كرت جداول البث المستلمة -->
    <div class="table-card">
        <div class="table-title">📊 جداول البث المباشر المستلمة</div>
        <div class="grid-header">
            <div>الأصل / الزوج</div>
            <div>السعر الحالي</div>
            <div>الحالة</div>
        </div>
        <div id="market-rows">
            <div class="grid-row" style="color: var(--text-muted); text-align: center; grid-template-columns: 1fr;">
                في انتظار إطلاق الاتصال المباشر...
            </div>
        </div>
    </div>

    <!-- كرت السجل التأريخي السفلي للاستماع وتفكيك الحزم -->
    <div class="log-card">
        <div class="log-title">📋 سجل محرك التمويه والكاشف اللحظي:</div>
        <div id="log-stream" class="log-stream"></div>
    </div>
</div>

<!-- هنا يتم دمج الجزء الثاني من الكود مباشرة ليعمل المحرك بالكامل -->
<script>
    let platformSocket = null;
    let renderSocket = null;
    const logStream = document.getElementById("log-stream");
    const statusBadge = document.getElementById("connection-status");

    function writeLog(message, direction = "sys") {
        const time = new Date().toTimeString().split(' ')[0];
        const logLine = document.createElement("div");
        logLine.className = `log-${direction}`;
        
        if (direction === "in") logLine.textContent = `[${time}] 📥 [وارد من المنصة] : ${message}`;
        else if (direction === "out") logLine.textContent = `[${time}] 📤 [صادر للمنصة] : ${message}`;
        else if (direction === "err") logLine.textContent = `[${time}] 🚨 [خطأ] : ${message}`;
        else logLine.textContent = `[${time}] ⚙️ [نظام] : ${message}`;
        
        logStream.appendChild(logLine);
        logStream.scrollTop = logStream.scrollHeight;
    }

    function startTunnel() {
        writeLog("جاري استدعاء نفق التمويه وفتح الاتصالات التبادلية...", "sys");
        
        // ربط نفق الباكيند الصامت الخاص بك على Render أولاً
        // عند الرفع الفعلي للمستودع، استبدل localhost برابط خادم Render الفعلي الخاص بك
        renderSocket = new WebSocket("ws://localhost:8765"); 
        
        renderSocket.onopen = () => {
            writeLog("تم ربط نفق الباكيند الصامت (Render) بنجاح فوري.", "sys");
            connectToPlatform();
        };
        
        renderSocket.onerror = () => writeLog("فشل ربط نفق Render العكسي. تأكد من تشغيل السيرفر الباكيند.", "err");
    }

    function connectToPlatform() {
        // النطاق الجغرافي الديناميكي المكتشف والمحدث لعام 2026
        const geoUrl = "wss://api-us-north.po.market/socket.io/?EIO=4&transport=websocket";
        platformSocket = new WebSocket(geoUrl);
        platformSocket.binaryType = "arraybuffer";

        platformSocket.onopen = () => {
            statusBadge.textContent = "متصل بشري مباشر";
            statusBadge.className = "status-badge connected";
            writeLog("تم فتح مجرى الاتصال الحي مع المنصة بنجاح.", "sys");
        };

        platformSocket.onmessage = (event) => {
            // كسر التشفير الثنائي: تمرير الحزم الثنائية فوراً لـ Render دون تفكيكها في المتصفح لمنع ثقل الواجهة
            if (event.data instanceof ArrayBuffer) {
                writeLog(`حزمة بايتات ثنائية مستلمة (Binary Frame) بحجم ${event.data.byteLength} بايت`, "in");
                if (renderSocket && renderSocket.readyState === WebSocket.OPEN) {
                    renderSocket.send(event.data);
                }
                return;
            }

            const txt = event.data;
            writeLog(txt, "in");
            
            // تمرير الرسالة النصية للباكيند لتوثيقها ومراقبتها في عداد الـ Auditor
            if (renderSocket && renderSocket.readyState === WebSocket.OPEN) {
                renderSocket.send(txt);
            }

            // منع الطرد 41: عدم التسرع في التوثيق عند استلام حزمة البداية 0
            if (txt.startsWith("0{")) {
                writeLog("تم استقبال حزمة الترحيب 0. بانتظار الخادم لفتح الممر الأمني...", "sys");
                return; 
            }

            // الاستجابة الدقيقة والحاسمة فور استلام حزمة التثبيت 40 بشكل رسمي
            if (txt === "40") {
                writeLog("تم رصد حزمة التثبيت 40. الممر أمن الآن، إطلاق قذيفة التوثيق البشري المشفرة...", "sys");
                // التوكين وجلسة التداول المستخرجة من متصفحك البشري
                const authPacket = '42["auth",{"session":"a:4:{s:10:\\"session_id\\";s:32:\\"1d5d79...\"}"}]';
                platformSocket.send(authPacket);
                writeLog("تم إرسال حزمة التوثيق بنجاح.", "out");
            }

            // التعامل الديناميكي مع نبضات الحفاظ على الاتصال لمنع الخروج والتجميد
            if (txt === "2") {
                platformSocket.send("3");
                writeLog("تلبية نبض الحفاظ على المجرى حياً (Pong 3)", "out");
            }
        };

        platformSocket.onclose = (e) => {
            writeLog(`قطع الاتصال التلقائي من خادم المنصة. كود الفصل: ${e.code}`, "err");
            statusBadge.textContent = "غير متصل";
            statusBadge.className = "status-badge";
        };
    }

    function triggerSubscription() {
        const selectedAsset = document.getElementById("asset-select").value;
        
        if (!platformSocket || platformSocket.readyState !== WebSocket.OPEN) {
            writeLog("لا يمكن إرسال طلب جلب الأسعار، الاتصال البشري غير نشط حالياً.", "err");
            return;
        }

        writeLog(`إرسال تتابع أوامر تغيير الأصول والاشتراك للزوج: ${selectedAsset}`, "sys");
        
        // إطلاق حزمة الأوامر السبعة المتتالية لعام 2026 بفارق زمني لمنع الحظر
        const changePacket = `42["changeSymbol",{"asset":"${selectedAsset}","period":60}]`;
        const subPacket = `42["subFor","${selectedAsset}"]`;
        
        platformSocket.send(changePacket);
        writeLog(changePacket, "out");
        
        setTimeout(() => {
            platformSocket.send(subPacket);
            writeLog(subPacket, "out");
            updateUIList(selectedAsset);
        }, 150);
    }

    function updateUIList(asset) {
        const rowContainer = document.getElementById("market-rows");
        rowContainer.innerHTML = `
            <div class="grid-row">
                <div style="font-weight:bold; color:#1e70ff;">${asset}</div>
                <div id="live-price" style="font-family:monospace; color:var(--primary); font-weight:bold;">...جاري السحب ثنائياً</div>
                <div style="color:var(--primary); font-weight:bold;">نشط 🟢</div>
            </div>
        `;
    }

    function stopTunnel() {
        if (platformSocket) platformSocket.close();
        if (renderSocket) renderSocket.close();
        writeLog("تم فصل وإيقاف نفق الـ Passive Bridge بالكامل بطلب المستخدم.", "sys");
    }
</script>
</body>
</html>
