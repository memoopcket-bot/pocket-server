<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pocket Option - لوحة التحكم</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#131722; --border:#232838;
    --text:#e6e9f0; --muted:#8a92a6; --green:#26a69a; --red:#ef5350;
    --accent:#4f7cff;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:'Segoe UI', Tahoma, sans-serif;
    background:var(--bg); color:var(--text); padding:20px;
  }
  .wrap{max-width:900px; margin:0 auto}
  h1{font-size:20px; margin-bottom:4px}
  .sub{color:var(--muted); font-size:13px; margin-bottom:20px}
  .card{
    background:var(--panel); border:1px solid var(--border);
    border-radius:10px; padding:16px; margin-bottom:16px;
  }
  label{display:block; font-size:13px; color:var(--muted); margin-bottom:6px}
  input, select{
    width:100%; padding:10px; border-radius:8px; border:1px solid var(--border);
    background:#0e131f; color:var(--text); font-size:14px; margin-bottom:12px;
  }
  .row{display:flex; gap:10px}
  .row > div{flex:1}
  button{
    background:var(--accent); color:#fff; border:none; padding:10px 18px;
    border-radius:8px; cursor:pointer; font-size:14px; font-weight:600;
  }
  button:hover{opacity:.9}
  button:disabled{opacity:.4; cursor:not-allowed}
  button.secondary{background:#232838}
  .status{display:flex; align-items:center; gap:8px; font-size:14px; margin-bottom:10px}
  .dot{width:9px; height:9px; border-radius:50%; background:var(--red)}
  .dot.on{background:var(--green)}
  .stats{display:flex; gap:16px; flex-wrap:wrap}
  .stat{background:#0e131f; border:1px solid var(--border); border-radius:8px; padding:10px 16px; min-width:120px}
  .stat .v{font-size:18px; font-weight:700}
  .stat .l{font-size:12px; color:var(--muted)}
  table{width:100%; border-collapse:collapse; font-size:13px}
  th,td{padding:6px 8px; text-align:center; border-bottom:1px solid var(--border)}
  th{color:var(--muted); font-weight:600}
  .up{color:var(--green)} .down{color:var(--red)}
  .log{
    background:#0e131f; border:1px solid var(--border); border-radius:8px;
    padding:10px; font-size:12px; color:var(--muted); max-height:150px; overflow-y:auto;
    white-space:pre-wrap; font-family:monospace;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>لوحة تحكم Pocket Option</h1>
  <div class="sub">تتصل بسيرفر البيانات (server_scae.py) عبر WebSocket</div>

  <!-- الاتصال بالسيرفر -->
  <div class="card">
    <label>رابط السيرفر (WebSocket)</label>
    <input id="serverUrl" placeholder="wss://your-app.onrender.com" value="ws://localhost:8765">
    <label>SSID (جلسة Pocket Option)</label>
    <input id="ssid" placeholder="الصق قيمة الجلسة هنا">
    <div class="row">
      <div><button id="btnConnect" onclick="connect()">اتصال</button></div>
      <div><button class="secondary" id="btnDisconnect" onclick="disconnect()" disabled>قطع الاتصال</button></div>
    </div>
  </div>

  <!-- الحالة -->
  <div class="card">
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">غير متصل</span></div>
    <div class="stats">
      <div class="stat"><div class="v" id="balance">--</div><div class="l">الرصيد</div></div>
      <div class="stat"><div class="v" id="serverName">--</div><div class="l">السيرفر</div></div>
      <div class="stat"><div class="v" id="clock">--</div><div class="l">الوقت</div></div>
    </div>
  </div>

  <!-- طلب شموع -->
  <div class="card">
    <div class="row">
      <div>
        <label>الزوج</label>
        <select id="pair">
          <option>EURUSD</option><option>EURUSD_otc</option>
          <option>USDJPY</option><option>USDJPY_otc</option>
          <option>AUDUSD</option><option>AUDUSD_otc</option>
          <option>GBPUSD_otc</option>
        </select>
      </div>
      <div>
        <label>الفريم (دقائق)</label>
        <input id="tf" type="number" value="1" min="1">
      </div>
      <div>
        <label>عدد الشموع</label>
        <input id="limit" type="number" value="50" min="1" max="500">
      </div>
    </div>
    <button onclick="getCandles()">جلب الشموع</button>
  </div>

  <!-- الجدول -->
  <div class="card">
    <table id="candlesTable">
      <thead><tr><th>الوقت</th><th>فتح</th><th>أعلى</th><th>أدنى</th><th>إغلاق</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="card">
    <div class="log" id="log"></div>
  </div>
</div>

<script>
let ws = null;
let reqId = 0;
const pending = {};

function log(msg){
  const el = document.getElementById('log');
  const t = new Date().toLocaleTimeString();
  el.textContent += `[${t}] ${msg}\n`;
  el.scrollTop = el.scrollHeight;
}

function setStatus(connected, text){
  document.getElementById('dot').className = 'dot' + (connected ? ' on' : '');
  document.getElementById('statusText').textContent = text;
  document.getElementById('btnConnect').disabled = connected;
  document.getElementById('btnDisconnect').disabled = !connected;
}

function connect(){
  const url = document.getElementById('serverUrl').value.trim();
  const ssid = document.getElementById('ssid').value.trim();
  if(!url){ alert('أدخل رابط السيرفر'); return; }
  if(!ssid){ alert('أدخل SSID'); return; }

  try{
    ws = new WebSocket(url);
  }catch(e){
    log('خطأ في الرابط: ' + e.message);
    return;
  }

  ws.onopen = () => {
    log('تم فتح الاتصال بالسيرفر، جاري تسجيل الدخول...');
    ws.send(JSON.stringify({ action: 'connect', ssid: ssid }));
  };

  ws.onmessage = (ev) => {
    let data;
    try{ data = JSON.parse(ev.data); }catch(e){ return; }
    handleMessage(data);
  };

  ws.onerror = () => log('حدث خطأ في اتصال WebSocket');
  ws.onclose = () => {
    setStatus(false, 'غير متصل');
    log('تم إغلاق الاتصال');
  };
}

function disconnect(){
  if(ws){
    ws.send(JSON.stringify({ action: 'disconnect' }));
    ws.close();
    ws = null;
  }
  setStatus(false, 'غير متصل');
}

function handleMessage(data){
  if(data.action === 'connect'){
    if(data.success){
      setStatus(true, 'متصل');
      document.getElementById('balance').textContent = '$' + Number(data.balance).toFixed(2);
      document.getElementById('serverName').textContent = data.server || '--';
      log('نجح الاتصال: ' + data.message);
    } else {
      setStatus(false, 'فشل الاتصال');
      log('فشل: ' + (data.error || data.message));
    }
  }
  else if(data.action === 'status'){
    document.getElementById('balance').textContent = '$' + Number(data.balance).toFixed(2);
    document.getElementById('clock').textContent = data.time;
  }
  else if(data.action === 'candles'){
    if(data.success){
      renderCandles(data.data);
      log(`تم جلب ${data.count} شمعة لـ ${data.pair}`);
    } else {
      log('خطأ في جلب الشموع: ' + data.error);
    }
  }
  else if(data.success === false){
    log('خطأ: ' + data.error);
  }
}

function getCandles(){
  if(!ws || ws.readyState !== 1){ alert('اتصل بالسيرفر أولاً'); return; }
  const pair = document.getElementById('pair').value;
  const tf = document.getElementById('tf').value;
  const limit = document.getElementById('limit').value;
  ws.send(JSON.stringify({ action: 'candles', pair, tf: Number(tf), limit: Number(limit), id: ++reqId }));
  log(`طلب شموع: ${pair} - فريم ${tf}د - ${limit} شمعة`);
}

function renderCandles(rows){
  const tbody = document.querySelector('#candlesTable tbody');
  tbody.innerHTML = '';
  rows.slice().reverse().forEach(c => {
    const time = new Date(c.t * 1000).toLocaleTimeString();
    const cls = c.c >= c.o ? 'up' : 'down';
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${time}</td><td>${c.o.toFixed(5)}</td><td>${c.h.toFixed(5)}</td><td>${c.l.toFixed(5)}</td><td class="${cls}">${c.c.toFixed(5)}</td>`;
    tbody.appendChild(tr);
  });
}

// تحديث دوري للحالة كل 10 ثوان
setInterval(() => {
  if(ws && ws.readyState === 1){
    ws.send(JSON.stringify({ action: 'status' }));
  }
}, 10000);
</script>
</body>
</html>
