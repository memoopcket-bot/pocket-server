<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Option Live Dashboard (2026)</title>
    <style>
        :root {
            --bg-main: #0b0e14;
            --bg-card: #151a22;
            --border: #222b36;
            --text: #c5cdd8;
            --primary: #2463eb;
            --success: #10b981;
            --danger: #ef4444;
        }
        body {
            background-color: var(--bg-main);
            color: var(--text);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        input, select, button {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            background: #1e2530;
            border: 1px solid var(--border);
            color: #fff;
            border-radius: 8px;
            font-size: 14px;
            margin-top: 5px;
        }
        button {
            background: var(--primary);
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }
        button:active { transform: scale(0.98); }
        .btn-danger { background: var(--danger); }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }
        .badge {
            padding: 4px 8px;
            border-radius: 20px;
            font-weight: bold;
        }
        .badge-red { background: rgba(239,68,68,0.2); color: var(--danger); }
        .badge-green { background: rgba(16,185,129,0.2); color: var(--success); }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 13px;
        }
        th, td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }
        th { background: #1a222d; color: #94a3b8; }
        .log-box {
            background: #000;
            color: #38bdf8;
            font-family: monospace;
            padding: 10px;
            border-radius: 8px;
            height: 160px;
            overflow-y: auto;
            font-size: 11px;
            direction: ltr;
            text-align: left;
        }
    </style>
</head>
<body>
<div class="container">

    <!-- كارت التحكم بالاتصال البشري المباشر -->
    <div class="card">
        <div class="status-bar">
            <div>حالة الاتصال: <span id="statusBadge" class="badge badge-red">منقطع</span></div>
            <div>الرصيد: <span id="balanceText" style="color:var(--success); font-weight:bold;">$0.00</span></div>
        </div>
        <input type="text" id="ssidInput" placeholder="ضع حزمة التوثيق الكاملة المنسوخة من الهاتف هنا...">
        <div class="grid-2" style="margin-top: 10px;">
            <button id="connectBtn" onclick="initSmartConnection()">اتصال بشري مباشر</button>
            <button class="btn-danger" onclick="disconnectAll()">قطع الاتصال</button>
        </div>
    </div>

    <!-- كارت سحب وفحص الشموع -->
    <div class="card">
        <div class="grid-2">
            <div>
                <label>الزوج المختار</label>
                <select id="pairSelect">
                    <option value="EURUSD">EURUSD (عالمي)</option>
                    <option value="EURUSD_otc">EURUSD_otc (منصة)</option>
                    <option value="USDJPY_otc">USDJPY_otc (منصة)</option>
                    <option value="GBPUSD_otc">GBPUSD_otc (منصة)</option>
                </select>
            </div>
            <div>
                <label>عدد الشموع</label>
                <input type="number" id="limitInput" value="50">
            </div>
        </div>
        <button style="margin-top:12px; background:var(--success);" onclick="requestLiveCandles()">جلب وفحص الشموع اللحظية</button>
    </div>

    <!-- جداول عرض الأسعار والنتائج المفرزة -->
    <div class="card">
        <h4 style="margin:0 0 10px 0;">📊 جداول البث المباشر المستلمة</h4>
        <table>
            <thead>
                <tr>
                    <th>الأصل / الزوج</th>
                    <th>السعر الحالي</th>
                    <th>الحالة اللحظية</th>
                </tr>
            </thead>
            <tbody id="pairsTableBody">
                <tr>
                    <td colspan="3" style="color:#64748b;">في انتظار إطلاق الاتصال المباشر...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- سجل محرك التمويه المكشوف لكشف حركة البيانات -->
    <div class="card">
        <div class="status-bar" style="margin-bottom:5px;">
            <span style="font-weight:bold;">📜 سجل محرك التمويه والكاشف اللحظي:</span>
            <span id="serverTime" style="color:#64748b;">--:--:--</span>
        </div>
        <div id="logBox" class="log-box">جاهز تماماً ومستمع لحزمة التوثيق...</div>
    </div>

</div>
<script>
    let localWS = null; 
    let renderWS = null; 
    let isConnected = false;

    const RENDER_WS_URL = window.location.origin.replace(/^http/, 'ws');

    function log(msg, isError = false) {
        const box = document.getElementById("logBox");
        const time = new Date().toLocaleTimeString();
        const color = isError ? "#ef4444" : "#38bdf8";
        box.innerHTML += `<div style="color:${color}">[${time}] ${msg}</div>`;
        box.scrollTop = box.scrollHeight;
    }

    function initSmartConnection() {
        let rawInput = document.getElementById("ssidInput").value.trim();
        if (!rawInput) {
            log("⚠️ خطأ: صندوق التوثيق فارغ!", true);
            return;
        }

        let ssid = "";

        if (rawInput.includes("session") && rawInput.includes("session_id")) {
            try {
                const match = rawInput.match(/session_id\\";s:32:\\"([a-f0-9]{32})\\"/);
                if (match && match[1]) {
                    ssid = match[1];
                    log(`✅ تم اقتناص الـ SSID بنجاح من مصفوفة الهاتف: ${ssid}`);
                }
            } catch (e) {
                log("⚠️ تنبيه: فشل تفكيك المصفوفة تلقائياً.");
            }
        }

        if (!ssid) {
            if (rawInput.startsWith("42")) rawInput = rawInput.substring(2);
            try {
                const parsed = JSON.parse(rawInput);
                if (parsed && parsed.session) {
                    ssid = parsed.session;
                } else { ssid = rawInput; }
            } catch (e) {
                ssid = rawInput;
            }
        }

        log("🚀 جاري فتح الاتصال وبدء فحص الردود اللحظية...");
        connectToPocketOption(ssid, rawInput);
    }

    function connectToPocketOption(ssid, originalPacket) {
        if (localWS) { localWS.close(); }

        const targetServer = "wss://api-eu.po.market/socket.io/?EIO=4&transport=websocket";
        log(`🌐 جاري توجيه طلب الـ WebSocket إلى خادم المنصة...`);
        
        localWS = new WebSocket(targetServer);

        localWS.onopen = function() {
            log("📥 [خطوة 1]: تم فتح الخط البشري المباشر. جاري إرسال حزمة الترقية 40...");
            localWS.send("40"); 
        };

        localWS.onmessage = function(evt) {
            const msg = evt.data;
            log(`📥 [وارد من المنصة]: ${msg.substring(0, 140)}`);

            if (msg === "2") {
                localWS.send("3");
                return;
            }

            if (msg.startsWith("0")) {
                log("📥 [خطوة 2]: تم استقبال حزمة الترحيب 0. جاري تمرير التوثيق...");
                if (originalPacket.startsWith("42")) {
                    localWS.send(originalPacket);
                } else {
                    const authPacket = {
                        "session": originalPacket, "isDemo": 0, "uid": 0,
                        "platform": 2, "isFastHistory": true, "isOptimized": true
                    };
                    localWS.send(`42["auth",${JSON.stringify(authPacket)}]`);
                }
                log(`📤 [صادر للمنصة]: تم إرسال حزمة التوثيق.`);
            }

            if (msg.startsWith("42")) {
                try {
                    const clean = msg.substring(2);
                    const parsed = JSON.parse(clean);
                    const eventName = parsed[0];
                    const data = parsed[1];

                    log(`🔔 [حدث مكتشف]: اسم الرد الوارد هو (${eventName})`);

                    if (!isConnected && (eventName === "successauth" || eventName === "updateBalance" || eventName === "balanceUpdated" || eventName === "updateAssets")) {
                        isConnected = true;
                        document.getElementById("statusBadge").className = "badge badge-green";
                        document.getElementById("statusBadge").innerText = "متصل بنجاح";
                        log("🎉 [نجاح كلي] انطلق البث اللحظي للأسعار بنجاح!");
                        connectToRenderServer();
                    }

                    if (data && (data.balance !== undefined || data.amount !== undefined)) {
                        const bal = data.balance || data.amount || 0;
                        document.getElementById("balanceText").innerText = `$${parseFloat(bal).toFixed(2)}`;
                    }

                    if (renderWS && renderWS.readyState === WebSocket.OPEN) {
                        renderWS.send(JSON.stringify({ action: "pipe_data", event: eventName, payload: data }));
                    }

                } catch (e) {
                    log(`⚠️ خطأ في التفسير: ${e.message}`, true);
                }
            }
        };

        localWS.onerror = function(err) {
            log("❌ خطأ: السيرفر قطع الاتصال فوراً. الحزمة منتهية الصلاحية كلياً.", true);
        };

        localWS.onclose = function() {
            log("🔌 مغلق: تم قطع الاتصال مع خادم المنصة.");
            updateDisconnectionUI();
        };
    }

    function connectToRenderServer() {
        if (renderWS) { renderWS.close(); }
        log("☁️ جاري ربط نفق البيانات المباشر بباكيند Render...");
        renderWS = new WebSocket(RENDER_WS_URL);

        renderWS.onopen = function() {
            log("✅ تم ربط الباكيند بنجاح، السيرفر مستعد لفرز الشموع.");
            renderWS.send(JSON.stringify({ action: "status" }));
        };

        renderWS.onmessage = function(evt) {
            try {
                const resp = JSON.parse(evt.data);
                if (resp.action === "candles" && resp.success) {
                    updateTableWithCandles(resp.pair, resp.data);
                }
            } catch (e) {}
        };
    }

    function requestLiveCandles() {
        if (!isConnected || !localWS) {
            log("⚠️ خطأ: لا يمكن طلب الشموع والسيرفر منقطع!", true);
            return;
        }
        const pair = document.getElementById("pairSelect").value;
        const limit = document.getElementById("limitInput").value || 50;

        log(`[⏳] طلب شموع: ${pair} - فريم 1 د - ${limit} شمعة`);
        
        let sym = pair;
        if (pair.endsWith("_otc") && !pair.startsWith("#")) {
            sym = `#${pair.replace("_otc", "")}_otc`;
        }
        
        const req = { "asset": sym, "period": 60, "time": Math.floor(Date.now() / 1000), "count": parseInt(limit) };
        localWS.send(`42["loadHistoryPeriod",${JSON.stringify(req)}]`);
    }

    function updateTableWithCandles(pair, data) {
        if (!data || data.length === 0) return;
        const lastCandle = data[data.length - 1];
        const tbody = document.getElementById("pairsTableBody");
        
        if (tbody.innerHTML.includes("في انتظار")) tbody.innerHTML = "";

        let rowId = `row_${pair}`;
        let row = document.getElementById(rowId);
        
        if (!row) {
            row = document.createElement("tr");
            row.id = rowId;
            tbody.appendChild(row);
        }

        const isUp = lastCandle.c >= lastCandle.o;
        const statusText = isUp ? "📈 صعود" : "📉 هبوط";
        const statusColor = isUp ? "#10b981" : "#ef4444";

        row.innerHTML = `
            <td style="font-weight:bold; color:#fff;">${pair}</td>
            <td style="color:#38bdf8; font-family:monospace; font-weight:bold;">${parseFloat(lastCandle.c).toFixed(5)}</td>
            <td style="color:${statusColor}; font-weight:bold;">${statusText}</td>
        `;
    }

    function disconnectAll() {
        if (localWS) localWS.close();
        if (renderWS) renderWS.close();
        updateDisconnectionUI();
        log("🔌 تم قطع الاتصال بالكامل.");
    }

    function updateDisconnectionUI() {
        isConnected = false;
        document.getElementById("statusBadge").className = "badge badge-red";
        document.getElementById("statusBadge").innerText = "غير متصل";
        document.getElementById("balanceText").innerText = "$0.00";
    }

    setInterval(() => {
        document.getElementById("serverTime").innerText = new Date().toLocaleTimeString();
    }, 1000);
</script>
</body>
</html>
