<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Option Live Dashboard</title>
    <style>
        :root { --bg: #0b0e14; --card: #151a22; --text: #e2e8f0; --green: #00e676; --red: #ff3d00; --border: #232d38; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
        header h1 { color: var(--green); margin: 0 0 5px 0; font-size: 1.5rem; }
        .status-bar { display: inline-block; padding: 5px 12px; border-radius: 20px; background: #1a233a; font-weight: bold; font-size: 0.85rem; }
        .status-online { color: var(--green); }
        .status-offline { color: var(--red); }
        .auth-section { background: var(--card); border: 1px solid var(--border); padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-weight: bold; color: #a0aec0; font-size: 0.9rem; }
        textarea { background: #0b0e14; border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 6px; resize: vertical; font-family: monospace; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        button { flex: 1; padding: 10px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; }
        .btn-connect { background: var(--green); color: #000; }
        .btn-disconnect { background: var(--red); color: #fff; }
        .tables-container { display: grid; grid-template-columns: 1fr; gap: 15px; }
        @media (min-width: 768px) { .tables-container { grid-template-columns: 1fr 1fr; } }
        .table-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 15px; }
        .table-card h2 { margin: 0 0 10px 0; border-bottom: 1px solid var(--border); padding-bottom: 8px; font-size: 1.1rem; }
        .forex-title { color: #38bdf8; }
        .otc-title { color: #f59e0b; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
        th, td { padding: 10px 8px; border-bottom: 1px solid var(--border); }
        th { color: #a0aec0; }
        .price-up { color: var(--green); font-weight: bold; }
        .price-down { color: var(--red); font-weight: bold; }
        .waiting { color: #718096; font-style: italic; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Pocket Option Live Dashboard</h1>
            <div class="status-bar">Status: <span id="server-status" class="status-offline">Connecting...</span></div>
        </header>
        <div class="auth-section">
            <div class="form-group">
                <label for="auth-token">Enter Pocket Option SSID (32 Chars):</label>
                <textarea id="auth-token" rows="2" placeholder="Paste your SSID token here..."></textarea>
            </div>
            <div class="btn-group">
                <button class="btn-connect" onclick="connectPO()">Connect Platform</button>
                <button class="btn-disconnect" onclick="disconnectPO()">Disconnect</button>
            </div>
        </div>
        <div class="tables-container">
            <div class="table-card">
                <h2 class="forex-title">🌐 Global Forex</h2>
                <table>
                    <thead><tr><th>Asset</th><th>Live Price</th></tr></thead>
                    <tbody id="forex-tbody">
                        <tr id="row-EURUSD"><td style="font-weight:bold;">EUR/USD</td><td id="price-EURUSD" class="waiting">Waiting...</td></tr>
                        <tr id="row-GBPUSD"><td style="font-weight:bold;">GBP/USD</td><td id="price-GBPUSD" class="waiting">Waiting...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="table-card">
                <h2 class="otc-title">📊 OTC Markets</h2>
                <table>
                    <thead><tr><th>Asset</th><th>Live Price</th></tr></thead>
                    <tbody id="otc-tbody">
                        <tr id="row-EURUSD_otc"><td style="font-weight:bold;">EUR/USD (OTC)</td><td id="price-EURUSD_otc" class="waiting">Waiting...</td></tr>
                        <tr id="row-GBPUSD_otc"><td style="font-weight:bold;">GBP/USD (OTC)</td><td id="price-GBPUSD_otc" class="waiting">Waiting...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script>
        let ws; const oldPrices = {}; const pairsToScan = ['EURUSD', 'GBPUSD', 'EURUSD_otc', 'GBPUSD_otc'];
        function initWebSocket() {
            const loc = window.location; const wsUri = (loc.protocol === "https:" ? "wss://" : "ws://") + loc.host + "/ws";
            ws = new WebSocket(wsUri);
            ws.onopen = () => {
                document.getElementById('server-status').innerText = "Gateway Connected. Enter SSID.";
                document.getElementById('server-status').className = "status-online"; startSyncLoop();
            };
            ws.onclose = () => {
                document.getElementById('server-status').innerText = "Gateway Disconnected. Retrying...";
                document.getElementById('server-status').className = "status-offline"; setTimeout(initWebSocket, 2000);
            };
            ws.onmessage = (event) => {
                try {
                    const res = JSON.parse(event.data);
                    if (res.action === "connect") { if (res.success) alert(res.message); else alert("Auth Failed: " + res.error); }
                    if (res.action === "scan" && res.results) { updateDashboardPrices(res.results); }
                } catch (e) { console.error(e); }
            };
        }
        function connectPO() {
            const ssid = document.getElementById('auth-token').value.trim(); if(!ssid) return alert("Please enter SSID first");
            if(ws && ws.readyState === WebSocket.OPEN) { ws.send(JSON.stringify({ action: "connect", ssid: ssid })); }
        }
        function disconnectPO() {
            if(ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ action: "disconnect" })); alert("Disconnected from platform.");
                pairsToScan.forEach(k => { const el = document.getElementById(`price-${k}`); if(el) { el.innerText = "Waiting..."; el.className = "waiting"; } });
            }
        }
        function updateDashboardPrices(results) {
            for (const [pair, info] of Object.entries(results)) {
                const el = document.getElementById(`price-${pair}`);
                if (el && info.success) {
                    const price = info.last_price; el.innerText = price;
                    if (oldPrices[pair]) { el.className = price > oldPrices[pair] ? 'price-up' : (price < oldPrices[pair] ? 'price-down' : el.className); }
                    oldPrices[pair] = price;
                }
            }
        }
        function startSyncLoop() { setInterval(() => { if (ws && ws.readyState === WebSocket.OPEN) { ws.send(JSON.stringify({ action: "scan", pairs: pairsToScan, tf: 1, limit: 10 })); } }, 1000); }
        window.onload = initWebSocket;
    </script>
</body>
</html>
